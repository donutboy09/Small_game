<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>霓虹贪吃蛇 · Neon Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="hud-item">
        <span class="hud-label">得分</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最高分</span>
        <span id="best" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">连击</span>
        <span id="combo" class="hud-value">x1</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>

      <div id="overlay" class="overlay">
        <h1 class="title">霓虹贪吃蛇</h1>
        <p class="subtitle" id="overlay-text">方向键 / WASD 控制，吃掉光点变得更强</p>
        <button id="start-btn" class="btn">开始游戏</button>
        <p class="hint">空格暂停 · R 重开 · 手机可滑动屏幕</p>
      </div>
    </div>

    <div class="touch-pad" id="touch-pad" aria-hidden="true">
      <button class="dpad up" data-dir="up">▲</button>
      <button class="dpad left" data-dir="left">◀</button>
      <button class="dpad right" data-dir="right">▶</button>
      <button class="dpad down" data-dir="down">▼</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
